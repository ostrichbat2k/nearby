name: 'Install sdbus-c++ 2.3.1'
description: >
  Builds and installs sdbus-c++ 2.3.1 from source. The Linux platform
  backend (internal/platform/implementation/linux) uses the ServiceName/
  PropertyName strong-type API, which predates what Ubuntu's own
  libsdbus-c++-dev apt package ships -- so this builds the real pinned
  version instead of the distro-packaged one.
runs:
  using: "composite"
  steps:
  - name: Cache sdbus-c++ 2.3.1 build
    id: sdbus-cpp-cache
    uses: actions/cache@v4
    with:
      path: /tmp/sdbus-cpp
      key: sdbus-cpp-2.3.1-${{ runner.os }}-v1
  - name: Install libsystemd headers
    run: sudo apt-get update && sudo apt-get install -y libsystemd-dev cmake
    shell: bash
  - name: Build sdbus-c++ 2.3.1
    if: steps.sdbus-cpp-cache.outputs.cache-hit != 'true'
    run: |
      git clone --depth 1 --branch v2.3.1 https://github.com/Kistler-Group/sdbus-cpp.git /tmp/sdbus-cpp
      cmake -S /tmp/sdbus-cpp -B /tmp/sdbus-cpp/build -DCMAKE_BUILD_TYPE=Release -DSDBUSCPP_BUILD_TESTS=OFF -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_INSTALL_LIBDIR=lib/x86_64-linux-gnu
      cmake --build /tmp/sdbus-cpp/build -j"$(nproc)"
    shell: bash
  - name: Install sdbus-c++
    run: |
      sudo cmake --install /tmp/sdbus-cpp/build
      sudo ldconfig
    shell: bash
